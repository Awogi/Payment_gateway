[package]
name = "esewa"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
thiserror = "1.0"
url = "2.4"

